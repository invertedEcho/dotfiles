- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.config/sway: sway
    ~/.config/hypr: hypr
    ~/.config/waybar: waybar
    ~/.config/kitty: kitty
    ~/.config/rofi: rofi
    ~/.zshrc: zshrc
    ~/.zprofile: zprofile
    ~/.ssh/config: ssh/config
    ~/.config/git: git
    ~/.config/tmux/tmux.conf: tmux.conf
    ~/.config/tmuxinator: tmuxinator
    ~/.config/i3: i3
    ~/.config/i3status: i3status
    ~/.xinitrc: xinitrc
    ~/.local/bin/:
      glob: true
      path: scripts/*
    ~/.config/redshift: redshift
    ~/Pictures/Wallpapers:
      glob: true
      path: Wallpapers/*

- create:
    - ~/Pictures/Wallpapers/
    - ~/.ssh
    - ~/.local/bin

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  -
    description: Installing tpm
    command: if [ ! -d "/home/$USER/.config/tmux/plugins/tpm/" ]; then git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm; fi
